<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rakshak · RVCE Campus Twin</title>
  <meta name="description" content="Simulation-based digital twin of the RVCE campus: predicting grid-frequency dips and relieving them with the fewest consenting appliances, before AUFLS cuts whole feeders.">
  <link rel="stylesheet" href="app/style.css">
  <script>
    // Apply the saved theme before first paint to avoid a flash.
    try { const t = localStorage.getItem("rakshak.theme"); if (t && t !== "system") document.documentElement.dataset.theme = t; } catch (_) {}
  </script>
  <script type="importmap">
    { "imports": { "three": "./vendor/three/three.module.min.js", "three/addons/": "./vendor/three/addons/", "three/examples/jsm/": "./vendor/three/addons/" } }
  </script>
</head>
<body>
  <header class="bar">
    <a class="brand" href="#story" aria-label="Rakshak home">
      <svg class="mark" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2 4 5v6c0 5 3.4 9.4 8 11 4.6-1.6 8-6 8-11V5l-8-3Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M8 12.5h2.2l1.3-3 2 6 1.3-3H16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span><b>Rakshak</b><small>RVCE campus twin</small></span>
    </a>
    <nav class="modes" aria-label="Views">
      <a href="#story" data-mode="story">Story</a>
      <a href="#compare" data-mode="compare">Compare</a>
      <a href="#explore" data-mode="explore">Explore</a>
      <a href="#results" data-mode="results">Results</a>
      <a href="#methods" data-mode="methods">Methods</a>
    </nav>
    <div class="bar-right">
      <div class="hz" id="hz" data-band="normal" title="Area frequency">
        <span class="hz-value" id="hz-value">50.000</span><span class="hz-unit">Hz</span>
      </div>
      <button class="icon-btn" id="theme" aria-label="Switch colour theme" title="Theme">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9Z" fill="currentColor"/></svg>
      </button>
    </div>
  </header>

  <main class="stage" id="stage">
    <canvas id="world" aria-label="3D view of the RVCE campus and surroundings. Drag to orbit, scroll to zoom, right-drag to pan."></canvas>
    <div id="labels" class="labels"></div>
    <div class="split-divider" id="split-divider" hidden>
      <span class="side-tag left" id="tag-left"></span><span class="side-tag right" id="tag-right"></span>
    </div>
    <div class="attribution" id="attribution"></div>
    <div class="loading" id="loading" hidden><span class="spinner"></span><span id="loading-text">Simulating…</span></div>

    <!-- Story -->
    <section class="panel story" id="panel-story" hidden>
      <div class="story-step" id="story-step"></div>
      <h1 id="story-title"></h1>
      <div id="story-body" class="story-body"></div>
      <div class="story-kpis" id="story-kpis"></div>
      <div class="story-nav">
        <button class="btn ghost" id="story-prev">Back</button>
        <div class="dots" id="story-dots"></div>
        <button class="btn primary" id="story-next">Next</button>
      </div>
    </section>

    <!-- Compare -->
    <section class="panel compare" id="panel-compare" hidden>
      <div class="compare-pickers">
        <label>Left <select id="cmp-left"></select></label>
        <label>Right <select id="cmp-right"></select></label>
      </div>
      <div class="kpi-grid" id="cmp-kpis"></div>
      <div class="chart-box"><div class="chart" id="cmp-chart"></div></div>
    </section>

    <!-- Explore -->
    <section class="panel explore" id="panel-explore" hidden>
      <h2>Scenario</h2>
      <label class="fld">Control policy
        <select id="x-mode">
          <option value="hybrid">Rakshak hybrid (pre-armed + predictive)</option>
          <option value="np_mrd">Rakshak predictive (central)</option>
          <option value="edge">Local frequency relays</option>
          <option value="rakshak">Fixed threshold rule</option>
          <option value="ufls">AUFLS only</option>
          <option value="none">No protection</option>
        </select>
      </label>
      <label class="fld rng">Generation lost <output id="o-x-loss"></output><input type="range" id="x-loss" min="1" max="15" step="0.5" value="5"></label>
      <label class="fld rng">Grid inertia H <output id="o-x-H"></output><input type="range" id="x-H" min="1.5" max="8" step="0.5" value="3"></label>
      <label class="fld">Governor response
        <select id="x-km"><option value="0.15">Calibrated to Indian events</option><option value="0.95">Textbook reheat unit</option></select>
      </label>
      <label class="fld rng">Households participating <output id="o-x-part"></output><input type="range" id="x-part" min="0" max="100" step="5" value="100"></label>
      <label class="fld rng">Command delay <output id="o-x-lat"></output><input type="range" id="x-lat" min="0" max="2" step="0.25" value="0"></label>
      <label class="fld rng">Packets lost <output id="o-x-pl"></output><input type="range" id="x-pl" min="0" max="60" step="5" value="0"></label>
      <label class="fld chk"><input type="checkbox" id="x-feeder" checked> Campus on AUFLS stage-1 feeder <span class="muted">(assumption)</span></label>
      <button class="btn primary wide" id="x-run">Simulate</button>
      <dl class="kv" id="x-kpis"></dl>
    </section>

    <!-- Building card -->
    <aside class="card building" id="building-card" hidden></aside>

    <!-- Explainer -->
    <aside class="drawer" id="explainer" hidden aria-label="Decision explainer">
      <header><h2 id="ex-title">Decision</h2>
        <div class="ex-nav">
          <button class="icon-btn" id="ex-prev" aria-label="Previous decision" title="Previous decision">‹</button>
          <span id="ex-count" class="muted"></span>
          <button class="icon-btn" id="ex-next" aria-label="Next decision" title="Next decision">›</button>
          <button class="icon-btn" id="ex-close" aria-label="Close">✕</button>
        </div></header>
      <div id="ex-body"></div>
    </aside>

    <!-- View controls -->
    <div class="view-tools" id="view-tools">
      <div class="seg" role="group" aria-label="Scene">
        <button class="chip-btn" id="view-photo" aria-pressed="false" title="Google photorealistic 3D campus">Photoreal</button>
        <button class="chip-btn" id="view-model" aria-pressed="true" title="Simulation model over satellite imagery">Model</button>
      </div>
      <button class="chip-btn" id="cam-orbit" title="Bird's-eye orbit">3D</button>
      <button class="chip-btn" id="cam-plan" title="Plan view">Plan</button>
      <label class="chip-btn tod" title="Time of day"><span id="o-tod">13:00</span><input type="range" id="tod" min="0" max="24" step="0.25" value="13"></label>
      <div class="legend">
        <span><i class="sw normal"></i>Supplied</span>
        <span><i class="sw curtailed"></i>Appliance paused</span>
        <span><i class="sw open"></i>Feeder cut by AUFLS</span>
      </div>
    </div>
  </main>

  <!-- Timeline -->
  <footer class="timeline" id="timeline">
    <button class="icon-btn play" id="tl-play" aria-label="Play">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path id="tl-play-icon" d="M8 5v14l11-7z" fill="currentColor"/></svg>
    </button>
    <div class="tl-track" id="tl-track">
      <svg class="tl-spark" id="tl-spark" preserveAspectRatio="none"></svg>
      <div class="tl-markers" id="tl-markers"></div>
      <input type="range" id="tl-scrub" min="0" max="270" step="0.5" value="0" aria-label="Simulated time">
    </div>
    <span class="tl-time" id="tl-time">0.0 s</span>
    <select id="tl-speed" aria-label="Playback speed"><option value="1">1×</option><option value="2">2×</option><option value="4" selected>4×</option><option value="10">10×</option></select>
  </footer>

  <!-- Full-page views -->
  <section class="page" id="page-results" hidden></section>
  <section class="page" id="page-methods" hidden></section>

  <script type="module" src="app/main.js"></script>
</body>
</html>
